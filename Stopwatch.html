<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stopwatch</title>
<style>
:root{--bg:#f3f0fa;--panel:#ffffff;--ink:#1e1b2e;--muted:#7a7590;--line:#e2ddf0;--run:#12b886;--pause:#f59f00;--stop:#f03e3e;--lap:#5c7cfa;--ring:#e2ddf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131f;--panel:#1f1c2e;--ink:#f1eefc;--muted:#9a95b3;--line:#332f47;--ring:#332f47}}
:root[data-theme="dark"]{--bg:#15131f;--panel:#1f1c2e;--ink:#f1eefc;--muted:#9a95b3;--line:#332f47;--ring:#332f47}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 16px;transition:background .4s}
.app{width:100%;max-width:440px}
.dial{position:relative;background:var(--panel);border-radius:28px;padding:28px 20px 24px;box-shadow:0 10px 40px rgba(92,124,250,.15);text-align:center}
svg{width:240px;max-width:100%;display:block;margin:0 auto}
.track{fill:none;stroke:var(--ring);stroke-width:8}
.prog{fill:none;stroke:var(--muted);stroke-width:8;stroke-linecap:round;stroke-dasharray:691;stroke-dashoffset:691;transition:stroke .4s}
.face{position:static}
.time{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;transition:color .4s}
.cs{font-size:26px;opacity:.7}
.status{font-size:14px;color:var(--muted);margin-top:2px}
.dial.running .prog{stroke:var(--run)}.dial.running .time{color:var(--run)}
.dial.paused .prog{stroke:var(--pause)}.dial.paused .time{color:var(--pause);animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
.dial.running svg{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
.btns{display:flex;gap:12px;margin-top:22px}
button{flex:1;border:0;border-radius:16px;padding:16px 8px;font:600 16px inherit;font-family:inherit;color:#fff;cursor:pointer;transition:transform .12s,filter .2s,opacity .2s,background .3s;position:relative;overflow:hidden}
button:hover:not(:disabled){filter:brightness(1.08)}
button:active:not(:disabled){transform:scale(.94)}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--lap);outline-offset:2px}
#main{background:var(--run);flex:1.5}#main.pause{background:var(--pause)}
#lap{background:var(--lap)}#reset{background:var(--stop)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .55s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.laps{margin-top:18px;background:var(--panel);border-radius:22px;padding:8px 6px;max-height:340px;overflow-y:auto}
.head,.row{display:grid;grid-template-columns:50px 1fr 1fr;padding:11px 14px;font-variant-numeric:tabular-nums}
.head{color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
.row{border-bottom:1px solid var(--line);animation:in .4s cubic-bezier(.2,1.4,.5,1);border-left:4px solid transparent}
.row:last-child{border-bottom:0}
.row.best{border-left-color:var(--run);color:var(--run)}
.row.worst{border-left-color:var(--stop);color:var(--stop)}
.row span:nth-child(n+2){text-align:right}
@keyframes in{from{opacity:0;transform:translateY(-14px) scale(.96);background:var(--lap)}to{opacity:1;transform:none}}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:14px}
.tip{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
:root{--dialc:#fbf8ef;--tick:#2a2640;--gold:#b8934a;--hand:#2a2640;--sec:#e03131}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--dialc:#0f1226;--tick:#ecd9a6;--gold:#d9b96a;--hand:#f4ecd4}}
:root[data-theme="dark"]{--dialc:#0f1226;--tick:#ecd9a6;--gold:#d9b96a;--hand:#f4ecd4}
.dialbg{fill:var(--dialc);transition:fill .4s}
.brand{font:600 9px "Space Grotesk",sans-serif;letter-spacing:4px;fill:var(--gold)}
.sub{fill:none;stroke:var(--gold);stroke-width:1;opacity:.8}
.mh{stroke:var(--hand);stroke-width:2}
.sh{stroke:var(--sec);stroke-width:1.6}
.pin{fill:var(--sec)}
.tk{stroke:var(--tick);stroke-width:1;opacity:.7}
.tk.big{stroke-width:2.6;opacity:1}
.tk.q{stroke:var(--gold)}
.num{font:600 12px "Space Grotesk",sans-serif;fill:var(--tick);text-anchor:middle;dominant-baseline:central}
.dial{background:radial-gradient(circle at 50% 0,var(--panel),var(--panel))}
.dial.running .pin,.dial.running .sh{filter:drop-shadow(0 0 3px var(--sec))}
.dial.running #minhand{transition:transform .2s}
.face{margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <section class="dial" id="dial">
    <svg viewBox="0 0 270 240" aria-hidden="true">
      <defs>
        <linearGradient id="bz" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f6e7b8"/><stop offset=".45" stop-color="#b8934a"/><stop offset="1" stop-color="#6e5424"/>
        </linearGradient>
        <radialGradient id="glass" cx=".35" cy=".25" r=".8">
          <stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect x="236" y="106" width="16" height="28" rx="5" fill="url(#bz)"/>
      <circle cx="120" cy="120" r="118" fill="url(#bz)"/>
      <circle cx="120" cy="120" r="113" class="dialbg"/>
      <circle class="track" cx="120" cy="120" r="108"/>
      <circle class="prog" id="prog" cx="120" cy="120" r="110" transform="rotate(-90 120 120)"/>
      <g id="ticks"></g>
      <text x="120" y="82" text-anchor="middle" class="brand">CHRONO</text>
      <circle cx="120" cy="160" r="26" class="sub"/>
      <g id="subticks"></g>
      <line id="minhand" x1="120" y1="160" x2="120" y2="140" class="mh" stroke-linecap="round"/>
      <g id="sechand">
        <line x1="120" y1="136" x2="120" y2="24" class="sh" stroke-linecap="round"/>
        <line x1="120" y1="120" x2="120" y2="136" class="sh" stroke-width="4" stroke-linecap="round"/>
      </g>
      <circle cx="120" cy="120" r="6" class="pin"/>
      <circle cx="120" cy="120" r="2.5" fill="#fff"/>
      <circle cx="120" cy="120" r="113" fill="url(#glass)" pointer-events="none"/>
    </svg>
    <div class="face">
      <div class="time" id="time" role="timer" aria-live="off">00:00<span class="cs">.00</span></div>
      <div class="status" id="status">Ready</div>
    </div>
    <div class="btns">
      <button id="reset" disabled>Reset</button>
      <button id="main">Start</button>
      <button id="lap" disabled>Lap</button>
    </div>
  </section>
  <section class="laps" id="laps" aria-label="Lap times">
    <div class="empty">Press Start, then Lap to record splits.</div>
  </section>
  <div class="tip">Keyboard: Space start/pause, L lap, R reset</div>
</main>
<script>
(function(){
  var dial=document.getElementById('dial'),timeEl=document.getElementById('time'),statusEl=document.getElementById('status'),
  main=document.getElementById('main'),lapBtn=document.getElementById('lap'),resetBtn=document.getElementById('reset'),
  lapsEl=document.getElementById('laps'),prog=document.getElementById('prog');
  var elapsed=0,startTs=0,raf=null,running=false,laps=[],lastLapAt=0;
  function fmt(ms){
    var t=Math.floor(ms/10),cs=t%100,s=Math.floor(t/100)%60,m=Math.floor(t/6000)%60,h=Math.floor(t/360000);
    var p=function(n){return n<10?'0'+n:''+n};
    return {main:(h?h+':':'')+p(m)+':'+p(s),cs:'.'+p(cs)};
  }
  function text(ms){var f=fmt(ms);return f.main+f.cs}
  function now(){return elapsed+(running?performance.now()-startTs:0)}
  function render(){
    var ms=now(),f=fmt(ms);
    timeEl.innerHTML=f.main+'<span class="cs">'+f.cs+'</span>';
    prog.style.strokeDashoffset=691*(1-(ms%60000)/60000);
    secHand.setAttribute('transform','rotate('+((ms%60000)/60000*360)+' 120 120)');
    minHand.setAttribute('transform','rotate('+((ms/60000)%60*6)+' 120 160)');
  }
  var NS='http://www.w3.org/2000/svg',secHand=document.getElementById('sechand'),minHand=document.getElementById('minhand');
  function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
  (function build(){
    var g=document.getElementById('ticks'),sg=document.getElementById('subticks');
    for(var i=0;i<60;i++){
      var big=i%5===0,a=i*Math.PI/30,r1=big?88:93,r2=98;
      el('line',{x1:120+r1*Math.sin(a),y1:120-r1*Math.cos(a),x2:120+r2*Math.sin(a),y2:120-r2*Math.cos(a),
        class:'tk'+(big?' big':'')+(i%15===0?' q':'')},g);
    }
    [[0,'60'],[15,'15'],[30,'30'],[45,'45']].forEach(function(n){
      if(n[0]===30)return;
      var a=n[0]*Math.PI/30,r=74;
      var t=el('text',{x:120+r*Math.sin(a),y:120-r*Math.cos(a),class:'num'},g);t.textContent=n[1];
    });
    for(var j=0;j<12;j++){
      var b=j*Math.PI/6;
      el('line',{x1:120+21*Math.sin(b),y1:160-21*Math.cos(b),x2:120+25*Math.sin(b),y2:160-25*Math.cos(b),class:'tk'},sg);
    }
  })();
  function tick(){render();if(running)raf=requestAnimationFrame(tick)}
  function setState(s){
    dial.className='dial '+s;
    main.textContent=s==='running'?'Pause':(s==='paused'?'Resume':'Start');
    main.classList.toggle('pause',s==='running');
    statusEl.textContent=s==='running'?'Running':(s==='paused'?'Paused':'Ready');
    lapBtn.disabled=s!=='running';
    resetBtn.disabled=(s==='idle'||s==='');
  }
  function toggle(){
    if(running){elapsed+=performance.now()-startTs;running=false;cancelAnimationFrame(raf);render();setState('paused')}
    else{startTs=performance.now();running=true;setState('running');tick()}
  }
  function lap(){
    if(!running)return;
    var t=now();laps.unshift({n:laps.length+1,split:t-lastLapAt,total:t});lastLapAt=t;drawLaps(true);
  }
  function reset(){
    running=false;cancelAnimationFrame(raf);elapsed=0;laps=[];lastLapAt=0;render();setState('idle');drawLaps(false);
  }
  function drawLaps(animateFirst){
    if(!laps.length){lapsEl.innerHTML='<div class="empty">Press Start, then Lap to record splits.</div>';return}
    var best=null,worst=null;
    if(laps.length>1){
      var sp=laps.map(function(l){return l.split});
      best=Math.min.apply(null,sp);worst=Math.max.apply(null,sp);
    }
    var html='<div class="head"><span>Lap</span><span style="text-align:right">Split</span><span style="text-align:right">Total</span></div>';
    laps.forEach(function(l,i){
      var c=l.split===best?' best':(l.split===worst?' worst':'');
      var style=(!animateFirst&&i===0)||i>0?'style="animation:none"':'';
      html+='<div class="row'+c+'" '+style+'><span>#'+l.n+'</span><span>'+text(l.split)+'</span><span>'+text(l.total)+'</span></div>';
    });
    lapsEl.innerHTML=html;
  }
  function ripple(e){
    var b=e.currentTarget,r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)/3,s=document.createElement('span');
    s.className='ripple';s.style.width=s.style.height=d+'px';
    s.style.left=(e.clientX-r.left-d/2)+'px';s.style.top=(e.clientY-r.top-d/2)+'px';
    b.appendChild(s);setTimeout(function(){s.remove()},600);
  }
  [main,lapBtn,resetBtn].forEach(function(b){b.addEventListener('pointerdown',function(e){if(!b.disabled)ripple(e)})});
  main.addEventListener('click',toggle);lapBtn.addEventListener('click',lap);resetBtn.addEventListener('click',reset);
  document.addEventListener('keydown',function(e){
    if(e.repeat||e.target.tagName==='BUTTON'&&e.code==='Space')return;
    if(e.code==='Space'){e.preventDefault();toggle()}
    else if(e.key==='l'||e.key==='L')lap();
    else if((e.key==='r'||e.key==='R')&&!resetBtn.disabled)reset();
  });
  setState('idle');render();
})();
</script>
</body>
</html>
